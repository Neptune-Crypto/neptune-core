[package]
name = "neptune-defi"
description = "Generic tools for decentralized finance on Neptune Cash"
authors = ["Triton Software"]

version = "0.19.0"
edition = "2021"
license = "Apache-2.0"

homepage = "https://neptune.cash/"
repository = "https://github.com/Neptune-Crypto/neptune-core/"

[features]
# implements arbitrary::Arbitrary for various types
arbitrary-impls = [
    "dep:arbitrary",
    "neptune-consensus/arbitrary-impls",
    "neptune-primitives/arbitrary-impls",
]

# builds `neptune-core-stand-in`, which `neptune-defi`'s integration tests run
# in place of `neptune-core`
test-stand-in = []

[[bin]]
name = "neptune-core-stand-in"
path = "src/bin/neptune-core-stand-in.rs"
required-features = ["test-stand-in"]

[dependencies]
arbitrary = { version = "1.4.1", features = ["derive"], optional = true }
tasm-lib = "9.0.0"

neptune-consensus = { version = "0.19.0", path = "../neptune-consensus" }
neptune-mutator-set = { version = "0.19.0", path = "../neptune-mutator-set" }
neptune-primitives = { version = "0.19.0", path = "../neptune-primitives" }
neptune-rpc-api = { version = "0.19.0", path = "../neptune-rpc/api" }
neptune-rpc-client = { version = "0.19.0", path = "../neptune-rpc/client" }
neptune-wallet = { version = "0.19.0", path = "../neptune-wallet" }
num-traits = "0.2"
clap = { version = "4.5", features = ["derive"] }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "net", "process", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
# Depending on this crate with the `arbitrary-impls` and `test-stand-in`
# features turns them on for the crate under test and its dependencies when
# running `cargo test`.
neptune-defi = { path = ".", features = ["arbitrary-impls", "test-stand-in"] }

neptune-cash = { version = "0.19.0", path = "../neptune-core" }

proptest = "1.7"
proptest-arbitrary-interop = "0.1"
test-strategy = "0.3"

[lints]
workspace = true
