name: Formal (Lean)

on:
  push:
    branches: [master]
    paths:
      - "formal/**"
      - "neptune-mutator-set/**"
      - ".github/workflows/formal.yml"
  pull_request:
    paths:
      - "formal/**"
      - "neptune-mutator-set/**"
      - ".github/workflows/formal.yml"

jobs:
  mutator-set:
    name: Mutator set proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build, check axioms, compare vectors
        working-directory: formal/mutator-set
        run: ./check.sh
